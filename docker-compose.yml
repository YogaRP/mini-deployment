services:
  web:
    image: ${REGISTRY}/min-dep/web:${WEB_TAG}
    ports: ["80:8080"]
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    image: ${REGISTRY}/min-dep/gateway:${GATEWAY_TAG}
    env_file: "./apps/gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      retries: 5
      start_period: 20s
    depends_on: [product, order]
    restart: unless-stopped

  product:
    image: ${REGISTRY}/min-dep/product:${PRODUCT_TAG}
    env_file: "./apps/products"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  order:
    image: ${REGISTRY}/min-dep/order:${ORDER_TAG}
    env_file: "./apps/orders"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: