services:
  web:
    image: ${REGISTRY}/min-dep/web:${WEB_TAG}
    ports: ["80:8080"]
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    image: ${REGISTRY}/min-dep/gateway:${GATEWAY_TAG}
    env_file: "./apps/gateway/.env"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      retries: 5
      start_period: 20s
    depends_on: [products, orders]
    restart: unless-stopped

  products:
    image: ${REGISTRY}/min-dep/products:${PRODUCTS_TAG}
    env_file: "./apps/products/.env"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  orders:
    image: ${REGISTRY}/min-dep/orders:${ORDERS_TAG}
    env_file: "./apps/orders/.env"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:${POSTGRES_PORT}"
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: