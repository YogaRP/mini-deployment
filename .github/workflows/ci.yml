name: CI

on:
  push:
    branches: [main]
    tags:
      - "gateway-v*"
      - "product-v*"
      - "order-v*"
  pull_request:
    branches: [main]

permissions:
  id-token: write   # wajib untuk OIDC
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - id: set
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            SERVICE="${TAG%%-v*}"
            echo "services=[\"$SERVICE\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'services=["gateway","product","order"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.service }}/package-lock.json

      - name: Install, lint, test
        working-directory: apps/${{ matrix.service }}
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present

      # Langkah berikut hanya jalan saat push (bukan PR)
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata (tags)
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/min-dep/${{ matrix.service }}
          tags: |
            type=sha,format=short,prefix=,enable=${{ github.ref_type != 'tag' }}
            type=match,pattern=${{ matrix.service }}-v(.*),group=1

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push'

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}