name: Deploy

on:
  workflow_call:
    inputs:
      service: { type: string, required: true }
      tag:     { type: string, required: true }
  workflow_dispatch:
    inputs:
      service:
        description: Service
        type: choice
        options: [gateway, products, orders, web]
      tag:
        description: "Tag image (mis. 0.2.0 atau a1b2c3d)"
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVICE: ${{ inputs.service }}
      TAG: ${{ inputs.tag }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate input
        run: |
          [[ "$SERVICE" =~ ^(gateway|products|orders|web)$ ]] || { echo "service tidak valid"; exit 1; }
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "tag tidak valid"; exit 1; }
          [[ "$INSTANCE_ID" =~ ^i-[a-z0-9]{8,17}$ ]] || { echo "EC2_INSTANCE_ID kosong/salah"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          SCRIPT_B64=$(base64 -w0 deploy/deploy.sh)
          BACKUP_B64=$(base64 -w0 deploy/backup.sh)
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)

          PARAMS=$(jq -cn \
          --arg s "$SCRIPT_B64" --arg b "$BACKUP_B64" --arg c "$COMPOSE_B64" \
          --arg svc "$SERVICE" --arg tag "$TAG" --arg region "$AWS_REGION" \
          '{commands: [
            "set -e",
            "mkdir -p /opt/deploy",
            "echo \($s) | base64 -d > /opt/deploy/deploy.sh",
            "echo \($b) | base64 -d > /opt/deploy/backup.sh",
            "chmod 755 /opt/deploy/backup.sh",
            "echo \($c) | base64 -d > /home/ubuntu/app/docker-compose.yml.new",
            "AWS_REGION=\($region) bash /opt/deploy/deploy.sh \($svc) \($tag)"
          ]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SERVICE $TAG" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]