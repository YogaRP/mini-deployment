name: Deploy

on:
  workflow_call:
    inputs:
      service: { type: string, required: true }
      tag:     { type: string, required: true }
  workflow_dispatch:
    inputs:
      service:
        description: Service
        type: choice
        options: [gateway, products, orders, web]
      tag:
        description: "Tag image (mis. 0.2.0 atau a1b2c3d)"
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVICE: ${{ inputs.service }}
      TAG: ${{ inputs.tag }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Validate input
        run: |
          [[ "$SERVICE" =~ ^(gateway|products|orders|web)$ ]] || { echo "service tidak valid"; exit 1; }
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "tag tidak valid"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          VAR="$(echo "$SERVICE" | tr a-z A-Z)_TAG"

          SCRIPT=$(cat <<EOF
          set -euo pipefail
          cd /home/ubuntu/app
          REGISTRY=\$(grep '^REGISTRY=' .env | cut -d= -f2)
          cp .env .env.bak
          rollback() {
            echo "DEPLOY GAGAL, rollback"
            cp .env.bak .env
            docker compose up -d ${SERVICE}
          }
          trap rollback ERR
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin "\$REGISTRY"
          sed -i "s/^${VAR}=.*/${VAR}=${TAG}/" .env
          chown ubuntu:ubuntu .env && chmod 600 .env
          docker compose pull ${SERVICE}
          docker compose up -d --wait --wait-timeout 90 ${SERVICE}
          docker compose ps ${SERVICE}
          echo "OK: ${SERVICE} -> ${TAG}"
          EOF
          )

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SERVICE $TAG" \
            --parameters "$(jq -cn --arg s "$SCRIPT" '{commands: [$s]}')" \
            --query Command.CommandId --output text)

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]